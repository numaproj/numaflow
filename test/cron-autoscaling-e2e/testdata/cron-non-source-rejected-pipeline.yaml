apiVersion: numaflow.numaproj.io/v1alpha1
kind: Pipeline
metadata:
  name: cron-non-source-rejected-pipeline
spec:
  vertices:
    - name: input
      source:
        generator:
          rpu: 5
    - name: output
      sink:
        log: {}
      # Cron on a non-source (sink) vertex must be rejected.
      scale:
        cron:
          timezone: UTC
          schedules:
            - start: "{{.Start}}"
              end: "{{.End}}"
              min: 3
              max: 5
  edges:
    - from: input
      to: output
