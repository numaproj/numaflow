apiVersion: numaflow.numaproj.io/v1alpha1
kind: Pipeline
metadata:
  name: map-retry-drop
spec:
  vertices:
    - name: in
      limits:
        readBatchSize: 1
      source:
        http: {}
    - name: udf
      udf:
        container:
          # Always fails a message whose body == "fail".
          image: quay.io/numaio/numaflow-rs/map-conditional-fail:stable
          imagePullPolicy: IfNotPresent
        retryStrategy:
          backoff:
            interval: 1s
            steps: 2
            factor: 2
            cap: 3s
            jitter: 0
          onFailure: "drop"
    - name: out
      sink:
        log: {}
  edges:
    - from: in
      to: udf
    - from: udf
      to: out
