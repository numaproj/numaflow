apiVersion: numaflow.numaproj.io/v1alpha1
kind: Pipeline
metadata:
  name: runtime-error-transformer-pipeline
spec:
  vertices:
    - name: in
      scale:
        min: 1
      limits:
        readBatchSize: 1
      source:
        http:
          service: true
        transformer:
          container:
            # mapt-panic exits on Transform, which exercises UDF failure capture and forwarder rebuild.
            image: quay.io/numaio/numaflow-go/mapt-panic:stable
            imagePullPolicy: IfNotPresent
    - name: out
      sink:
        log: {}
  edges:
    - from: in
      to: out
