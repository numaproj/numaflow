apiVersion: numaflow.numaproj.io/v1alpha1
kind: MonoVertex
metadata:
  name: sqs-reader
spec:
  source:
    sqs:
      # Single queue (legacy). For multiple queues in the same AWS account and
      # region, use queueNames instead of queueName (mutually exclusive):
      #   queueNames: "orders-queue,refunds-queue,replay-queue"
      queueName: "sqs-numa-test"
      awsRegion: "us-west-2"
      queueOwnerAWSAccountID: "123456789012"
      maxNumberOfMessages: 10
      visibilityTimeout: 30
      waitTimeSeconds: 20
      attributeNames:
        - All
      messageAttributeNames:
        - All
  sink:
    log: {}
  scale:
    min: 1
    max: 2