version: 2
updates:
  # Go modules (root)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      go-dependencies:
        applies-to: security-updates
        patterns:
          - "*"

  # npm (UI)
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      ui-dependencies:
        applies-to: security-updates
        patterns:
          - "*"

  # Cargo (Rust workspace)
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      rust-dependencies:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      github-actions:
        applies-to: security-updates
        patterns:
          - "*"
